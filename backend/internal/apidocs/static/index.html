<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CampusClaw 接口文档</title><style>body{max-width:1000px;margin:40px auto;padding:20px;font:16px system-ui;line-height:1.6}details{border:1px solid #ddd;padding:12px;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}summary{cursor:pointer;font-weight:600}</style><h1>CampusClaw 接口文档</h1><p><a href="/openapi.json">OpenAPI JSON</a></p><main id="content">正在读取接口…</main><script>fetch('/openapi.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{const c=document.querySelector('#content');c.replaceChildren();for(const[p,verbs]of Object.entries(d.paths)){for(const[m,v]of Object.entries(verbs)){if(!['get','post','put','delete','patch'].includes(m))continue;const section=document.createElement('details'),title=document.createElement('summary'),body=document.createElement('pre');title.textContent=m.toUpperCase()+' '+p+' · '+(v.summary||'');body.textContent=JSON.stringify(v,null,2);section.append(title,body);c.append(section)}}}).catch(()=>document.querySelector('#content').textContent='接口文档读取失败，请重试。')</script></html>
