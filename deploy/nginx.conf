# CampusClaw web 入口：托管前端静态资源，同源反代 /api 与 /health 到 api。
# 注意：上传目录不作为静态资源暴露（design.md D1/D7），文件读取必须过鉴权接口。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端 SPA：所有页面路由回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 同源 API 反代（与开发环境 Vite 代理路径一致）
    location /api/ {
        proxy_pass http://api:${API_PORT};
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2m;
    }

    location /swagger {
        proxy_pass http://api:${API_PORT};
    }
    location = /openapi.json {
        proxy_pass http://api:${API_PORT};
    }

    location = /health {
        proxy_pass http://api:${API_PORT}/health;
    }
    location = /live { proxy_pass http://api:${API_PORT}/live; }
}
