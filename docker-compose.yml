name: ${COMPOSE_PROJECT_NAME:?请填写COMPOSE_PROJECT_NAME}
x-api: &api
  image: campusclaw-team-api:${APP_VERSION:?请填写APP_VERSION}
  build: ./backend
  env_file: .env
  volumes: ["uploads:/app/uploads"]
  depends_on:
    db: {condition: service_healthy}
  restart: unless-stopped
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root
      MYSQL_DATABASE: ${MYSQL_DATABASE:?请填写MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?请填写MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请填写MYSQL_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysqladmin ping -h 127.0.0.1 -u "$$MYSQL_USER" --silent']
      interval: 2s
      timeout: 2s
      retries: 40
    volumes: ["dbdata:/var/lib/mysql"]
    secrets: [mysql_root]
  api:
    <<: *api
  worker:
    <<: *api
    command: [/app/grade-worker]
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      api: {condition: service_started}
  relay:
    <<: *api
    command: [/app/grade-relay]
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      api: {condition: service_started}
  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?请填写RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请填写RABBITMQ_PASSWORD}
    volumes: ["rabbitdata:/var/lib/rabbitmq"]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 30
  qdrant:
    image: qdrant/qdrant:v1.11.3
    volumes: ["qdrant_data:/qdrant/storage"]
  mcp-demo:
    image: campusclaw-team-mcp:${APP_VERSION:?请填写APP_VERSION}
    build: ./mcp-server
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?请填写MCP_AUTH_TOKEN}
      MCP_PORT: "8090"
  web:
    image: campusclaw-team-web:${APP_VERSION:?请填写APP_VERSION}
    build: {context: ., dockerfile: deploy/Dockerfile.web}
    environment:
      API_PORT: ${API_PORT:?请填写API_PORT}
    ports: ["127.0.0.1:${WEB_PORT:?请填写WEB_PORT}:80"]
    depends_on: [api]
  gateway:
    profiles: [test]
    image: node:22-alpine
    command: [node, /fixture/gateway.mjs]
    volumes: ["./apitest/gateway.mjs:/fixture/gateway.mjs:ro"]
volumes:
  dbdata:
  uploads:
  qdrant_data:
  rabbitdata:
secrets:
  mysql_root:
    file: ./.secrets/mysql-root
