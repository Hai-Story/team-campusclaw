schema: spec-driven
context: |
  项目：CampusClaw 中小学教研智能体功能扩展。
  规划扩展为备课、命题、诊断、图谱、间隔复习、讲题模拟、学生互评。
  七项扩展保留为候选，首轮业务迭代待评审确定；不得自行指定优先级或把候选写成已实现。
  在现有平台上增量开发，当前能力见 docs/platform-overview.md。
  沿用 React/TypeScript、Go、MySQL、Qdrant、SSE、MCP 与 Docker Compose；以平台实现为事实，保持接口与错误契约一致。
  身份、角色、班级归属由 Go 服务端重新读取；跨班资源与不存在同形 404；口令 bcrypt；机密仅来自环境变量。
  规范以 AGENTS.md 和 harness/rules/ 为准，流程技能在 .agents/skills/。
  仅在归档时更新 openspec/specs/；每次功能改动先有四件套，逐条验证后再勾选任务。
  业务文档用中文；保留 OpenSpec 英文结构标题与 SHALL/MUST。
rules:
  proposal:
    - 写清本轮交付与 Non-goals，区分规划和已验证事实。
  specs:
    - 每条 Requirement 至少一组 GIVEN/WHEN/THEN，失败路径至少含参数非法、无权限、资源不存在、依赖不可达。
    - 数值和输入输出写具体，新增能力 Purpose 不少于 50 个字符。
  tasks:
    - 骨架排最前，每条任务写 verify；未经实际验证不得勾选。
